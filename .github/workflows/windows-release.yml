name: Windows release

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "ui/**"
      - "assets/**"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\notchbud.iss'

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $installer = "installer\Output\Notchbud-Setup-0.1.2.exe"
          if (!(Test-Path $installer)) { throw "Installer was not produced: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          "$hash  Notchbud-Setup-0.1.2.exe" | Set-Content "installer\Output\SHA256SUMS.txt"

      - name: Publish public preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: master
          name: NotchBud v0.1.2 — Public Preview
          prerelease: true
          generate_release_notes: true
          body: |
            First public preview of NotchBud for Windows x64.

            - Native Rust + Win32 shell with Direct2D / DirectComposition rendering.
            - WebView2 chat panel with hover-to-expand and collapse-to-cancel behavior.
            - Bring your own Groq API key. The key is stored locally using Windows DPAPI; chat requests go directly to Groq and are billed to your Groq account.
            - No NotchBud backend or account system.

            **Requirements:** Windows x64 and the Microsoft Edge WebView2 Runtime. A Groq API key is required for chat.
          files: |
            installer/Output/Notchbud-Setup-0.1.2.exe
            installer/Output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
