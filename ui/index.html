<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--NOTCHBUD_CSS-->
</head>

<body>
    <main id="island">
        <!-- Top chrome: launcher, brand (cat logo), notifications, settings -->
        <header class="topbar">
            <button class="iconbtn" type="button" aria-label="Apps">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">

                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 6.2c0-1.12 0-1.68.218-2.108a2 2 0 0 1 .874-.874C15.52 3 16.08 3 17.2 3h.6c1.12 0 1.68 0 2.108.218a2 2 0 0 1 .874.874C21 4.52 21 5.08 21 6.2v.6c0 1.12 0 1.68-.218 2.108a2 2 0 0 1-.874.874C19.48 10 18.92 10 17.8 10h-.6c-1.12 0-1.68 0-2.108-.218a2 2 0 0 1-.874-.874C14 8.48 14 7.92 14 6.8z" fill="none" />
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 17.2c0-1.12 0-1.68.218-2.108a2 2 0 0 1 .874-.874C15.52 14 16.08 14 17.2 14h.6c1.12 0 1.68 0 2.108.218a2 2 0 0 1 .874.874C21 15.52 21 16.08 21 17.2v.6c0 1.12 0 1.68-.218 2.108a2 2 0 0 1-.874.874C19.48 21 18.92 21 17.8 21h-.6c-1.12 0-1.68 0-2.108-.218a2 2 0 0 1-.874-.874C14 19.48 14 18.92 14 17.8z" fill="none" />
                </svg>
            </button>
            <div class="brand">
                <img class="brand-logo" src="__NOTCHBUD_LOGO__" alt="notchbud logo" />
                <span class="brand-name">Notchbud</span>
                <span class="beta">Beta</span>
            </div>
            <div class="topactions">
                <button class="iconbtn bell" type="button" aria-label="Notifications">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.159 17.724a60 60 0 0 1-3.733-.297 1.587 1.587 0 0 1-1.33-2.08c.161-.485.324-.963.367-1.478l.355-4.26a7.207 7.207 0 0 1 14.365 0l.355 4.262c.043.515.206.993.367 1.479a1.587 1.587 0 0 1-1.33 2.077 60 60 0 0 1-3.732.297m-5.684 0q2.841.135 5.684 0m-5.684 0v.434a2.842 2.842 0 1 0 5.684 0v-.434" fill="none" />
                    </svg>
                    <span class="dot" aria-hidden="true"></span>
                </button>
                <button class="iconbtn" type="button" aria-label="Settings">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.2 4.12c.632-.618.947-.927 1.31-1.043.319-.103.661-.103.98 0 .363.116.678.425 1.31 1.043l.303.297c.273.267.409.4.567.497q.211.128.453.187c.18.044.37.046.752.05l.425.005c.883.009 1.325.013 1.663.188.298.153.54.395.694.693.174.338.178.78.187 1.663l.005.425c.004.382.006.573.05.752q.059.242.187.453c.096.158.23.295.497.567l.297.304c.618.63.927.946 1.043 1.309.103.319.103.661 0 .98-.116.363-.425.678-1.043 1.31l-.297.303c-.267.273-.4.409-.497.567q-.128.211-.187.453c-.044.18-.046.37-.05.752l-.005.425c-.009.883-.013 1.325-.187 1.663-.154.298-.396.54-.694.694-.338.174-.78.178-1.663.187l-.425.005c-.382.004-.573.006-.752.05q-.24.059-.453.187c-.158.096-.294.23-.567.497l-.304.297c-.63.618-.946.927-1.309 1.043a1.6 1.6 0 0 1-.98 0c-.363-.116-.678-.425-1.31-1.043l-.303-.297c-.272-.267-.409-.4-.567-.497a1.6 1.6 0 0 0-.453-.187c-.18-.044-.37-.046-.752-.05l-.425-.005c-.883-.009-1.325-.013-1.663-.187a1.6 1.6 0 0 1-.693-.694c-.175-.338-.18-.78-.188-1.663l-.005-.425c-.004-.382-.006-.573-.05-.752a1.6 1.6 0 0 0-.187-.453c-.096-.158-.23-.294-.497-.567l-.297-.304c-.618-.63-.927-.946-1.043-1.309a1.6 1.6 0 0 1 0-.98c.116-.363.425-.678 1.043-1.31l.297-.303c.267-.272.4-.409.497-.567q.128-.212.187-.453c.044-.18.046-.37.05-.752l.005-.425c.009-.883.013-1.325.188-1.663a1.6 1.6 0 0 1 .693-.693c.338-.175.78-.18 1.663-.188l.425-.005c.382-.004.573-.006.752-.05q.242-.059.453-.187c.158-.096.295-.23.567-.497z" fill="none" />
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.991 12c0-.552.457-1 1.01-1s1.008.448 1.008 1-.457 1-1.009 1-1.009-.448-1.009-1Z" fill="none" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Onboarding: first run, no saved name -->
        <section id="screen-onboarding" class="screen" hidden>
            <h1 class="title">What should we call you?</h1>
            <input id="name-input" class="field" type="text" maxlength="30" placeholder="Type your name" autocomplete="off" spellcheck="false" />
            <p id="name-error" class="error" hidden></p>
        </section>

        <!-- SignIn: named but not connected -->
        <section id="screen-signin" class="screen" hidden>
            <p id="signin-status" class="status" hidden></p>
            <button id="signin-btn" class="pill" type="button">Sign in with ChatGPT</button>
        </section>

        <!-- Home: signed in, nothing asked yet — greeting owns the top -->
        <section id="screen-home" class="screen" hidden>
            <div class="greet">
                <span class="greet-tile" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.379 21h3.242M12 2V1m7 3.707L19.707 4m-15 .707L4 4m18 7h-1M3 11H2m4.313-.532c0-3.023 2.546-5.474 5.687-5.474s5.688 2.45 5.688 5.474c0 1.657-.765 3.142-1.974 4.146-.51.424-.95.95-1.117 1.593l-.227.875c-.14.537-.624.912-1.18.912h-2.38a1.22 1.22 0 0 1-1.18-.912l-.227-.875c-.167-.643-.606-1.17-1.116-1.593-1.21-1.004-1.974-2.489-1.974-4.146Z" fill="none" />
                    </svg>
                </span>
                <div class="greet-text">
                    <h1 id="greeting" class="greet-title"></h1>
                    <p id="home-status" class="greet-sub" hidden></p>
                </div>
            </div>
            <div class="askbox">
                <span class="asklead" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.577 5.764c.46-.893.69-1.34.999-1.485a1 1 0 0 1 .848 0c.31.145.539.592.999 1.485l1.191 2.315c.08.154.12.232.171.3a1 1 0 0 0 .157.165c.065.055.14.098.291.186l2.386 1.387c.782.454 1.173.681 1.305.977a1 1 0 0 1 0 .812c-.132.296-.523.523-1.305.977l-2.386 1.387c-.15.088-.226.131-.291.186q-.088.073-.157.165c-.051.068-.091.146-.17.3l-1.192 2.315c-.46.893-.69 1.34-.999 1.485a1 1 0 0 1-.848 0c-.31-.145-.539-.592-.999-1.485l-1.191-2.315c-.08-.154-.12-.232-.171-.3a1 1 0 0 0-.157-.165 2 2 0 0 0-.291-.186l-2.386-1.387c-.782-.454-1.173-.681-1.305-.977a1 1 0 0 1 0-.812c.132-.296.523-.523 1.305-.977L6.767 8.73c.15-.088.226-.131.291-.186a1 1 0 0 0 .157-.165 2 2 0 0 0 .17-.3z" fill="none" />

                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.23 4.362c-.127-.126-.19-.19-.214-.263a.32.32 0 0 1 0-.198c.023-.073.087-.137.214-.263l.407-.408c.127-.127.19-.19.264-.214a.32.32 0 0 1 .198 0c.073.023.137.087.264.214l.407.408c.127.126.19.19.214.263a.32.32 0 0 1 0 .198c-.024.073-.087.137-.214.263l-.407.408c-.127.127-.19.19-.264.214a.32.32 0 0 1-.198 0c-.073-.023-.137-.087-.264-.214z" fill="none" />
                    </svg>
                </span>
                <input id="chat-input-home" class="askinput" type="text" maxlength="400" placeholder="Ask anything…" autocomplete="off" spellcheck="false" />
                <button id="home-send" class="send" type="button" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.934 12 3.09 5.732c-.481-1.635 1.05-3.147 2.665-2.628a54 54 0 0 1 12.64 5.963C19.525 9.793 21 10.442 21 12s-1.474 2.207-2.605 2.933a54 54 0 0 1-12.64 5.963c-1.614.519-3.146-.993-2.665-2.628zm0 0h4.9" fill="none" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- Chat: history / live stream + pinned prompt -->
        <section id="screen-chat" class="screen" hidden>
            <p id="chat-status" class="status" hidden></p>
            <div id="history" class="history"></div>
            <div class="askbox">
                <span class="asklead" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.577 5.764c.46-.893.69-1.34.999-1.485a1 1 0 0 1 .848 0c.31.145.539.592.999 1.485l1.191 2.315c.08.154.12.232.171.3a1 1 0 0 0 .157.165c.065.055.14.098.291.186l2.386 1.387c.782.454 1.173.681 1.305.977a1 1 0 0 1 0 .812c-.132.296-.523.523-1.305.977l-2.386 1.387c-.15.088-.226.131-.291.186q-.088.073-.157.165c-.051.068-.091.146-.17.3l-1.192 2.315c-.46.893-.69 1.34-.999 1.485a1 1 0 0 1-.848 0c-.31-.145-.539-.592-.999-1.485l-1.191-2.315c-.08-.154-.12-.232-.171-.3a1 1 0 0 0-.157-.165 2 2 0 0 0-.291-.186l-2.386-1.387c-.782-.454-1.173-.681-1.305-.977a1 1 0 0 1 0-.812c.132-.296.523-.523 1.305-.977L6.767 8.73c.15-.088.226-.131.291-.186a1 1 0 0 0 .157-.165 2 2 0 0 0 .17-.3z" fill="none" />
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.46 19.406c-.254-.317-.381-.476-.429-.659a1 1 0 0 1 0-.494c.048-.183.175-.342.428-.66l.816-1.019c.254-.317.38-.475.527-.535a.52.52 0 0 1 .396 0c.146.06.273.218.527.535l.816 1.02c.253.317.38.476.428.659a1 1 0 0 1 0 .494c-.048.183-.175.342-.428.66l-.816 1.019c-.254.317-.38.475-.527.535a.52.52 0 0 1-.396 0c-.146-.06-.273-.218-.527-.535z" fill="none" />
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.23 4.362c-.127-.126-.19-.19-.214-.263a.32.32 0 0 1 0-.198c.023-.073.087-.137.214-.263l.407-.408c.127-.127.19-.19.264-.214a.32.32 0 0 1 .198 0c.073.023.137.087.264.214l.407.408c.127.126.19.19.214.263a.32.32 0 0 1 0 .198c-.024.073-.087.137-.214.263l-.407.408c-.127.127-.19.19-.264.214a.32.32 0 0 1-.198 0c-.073-.023-.137-.087-.264-.214z" fill="none" />
                    </svg>
                </span>
                <input id="chat-input" class="askinput" type="text" maxlength="400" placeholder="Ask anything…" autocomplete="off" spellcheck="false" />
                <button id="chat-send" class="send" type="button" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.934 12 3.09 5.732c-.481-1.635 1.05-3.147 2.665-2.628a54 54 0 0 1 12.64 5.963C19.525 9.793 21 10.442 21 12s-1.474 2.207-2.605 2.933a54 54 0 0 1-12.64 5.963c-1.614.519-3.146-.993-2.665-2.628zm0 0h4.9" fill="none" />
                    </svg>
                </button>
            </div>
        </section>
    </main>
    <!--NOTCHBUD_JS-->
</body>

</html>
